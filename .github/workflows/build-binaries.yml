name: Build standalone binaries (dispatch)

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "bazel/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - "BUILD.bazel"
      - ".bazelrc"
      - ".bazelignore"
      - ".bazelversion"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "patches/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      build_linux_x64:
        description: "Build Linux x64 (glibc) executable"
        type: boolean
        default: true
      build_linux_musl_x64:
        description: "Build Linux x64 (musl) executable"
        type: boolean
        default: true
      build_win32_x64:
        description: "Build Windows x64 executable"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-native-addons:
    name: Build native addons (bazel)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Install bazelisk
        run: |
          sudo curl -fsSL -o /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
      - id: cache
        uses: ./.github/actions/bazel-cache
        with:
          scope: hosted-dispatch
      - name: Build native addons (serial, OOM-safe)
        env:
          OMP_BAZEL_RC: ${{ steps.cache.outputs.rc }}
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          for target in \
            natives-linux-x64-baseline \
            natives-linux-x64-modern \
            natives-linux-musl-x64-baseline \
            natives-win32-x64-baseline; do
            bazelisk --bazelrc="$OMP_BAZEL_RC" build "//:$target"
          done
      - name: Save bazel disk cache
        if: steps.cache.outputs.save-needed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/omp-bazel-disk
            ~/.cache/omp-bazel-repo
          key: ${{ steps.cache.outputs.cache-key }}
      - name: Upload native addon artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-addons
          path: bazel-bin/natives-*/*.node
          if-no-files-found: error
          retention-days: 7

  build-linux-x64:
    name: "Build: linux-x64"
    needs: [build-native-addons]
    if: fromJSON(inputs.build_linux_x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/native-artifacts
        with:
          targets: linux-x64-baseline linux-x64-modern
      - name: Build release binary
        env:
          RELEASE_TARGETS: linux-x64
        run: bun run ci:release:build-binaries
      - name: Smoke release binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" packages/coding-agent/binaries/omp-linux-x64 --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" packages/coding-agent/binaries/omp-linux-x64 --smoke-test
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-binary-linux-x64
          path: packages/coding-agent/binaries/omp-linux-x64

  build-linux-musl-x64:
    name: "Build: linux-musl-x64"
    needs: [build-native-addons]
    if: fromJSON(inputs.build_linux_musl_x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/native-artifacts
        with:
          targets: linux-musl-x64-baseline
      - name: Build release binary
        env:
          RELEASE_TARGETS: linux-musl-x64
        run: bun run ci:release:build-binaries
      - name: Smoke musl binary on Alpine
        run: |
          binary="$(realpath packages/coding-agent/binaries/omp-linux-musl-x64)"
          docker run --rm -v "$binary:/usr/local/bin/omp:ro" alpine:3.22 sh -ec '
            apk add --no-cache libstdc++ libgcc >/dev/null
            runtime_dir="$(mktemp -d)"
            HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --version
            HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
          '
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-binary-linux-musl-x64
          path: packages/coding-agent/binaries/omp-linux-musl-x64

  build-win32-x64:
    name: "Build: win32-x64"
    needs: [build-native-addons]
    if: fromJSON(inputs.build_win32_x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/native-artifacts
        with:
          targets: win32-x64-baseline
      - name: Build release binary
        env:
          RELEASE_TARGETS: win32-x64
        run: bun run ci:release:build-binaries
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-binary-win32-x64
          path: packages/coding-agent/binaries/omp-windows-x64.exe

  checksums:
    name: Generate SHA256SUMS
    needs: [build-linux-x64, build-linux-musl-x64, build-win32-x64]
    if: |
      !cancelled() && (
        (fromJSON(inputs.build_linux_x64) && needs.build-linux-x64.result == 'success') ||
        (fromJSON(inputs.build_linux_musl_x64) && needs.build-linux-musl-x64.result == 'success') ||
        (fromJSON(inputs.build_win32_x64) && needs.build-win32-x64.result == 'success')
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: omp-binary-*
          path: packages/coding-agent/binaries
          merge-multiple: true
      - name: Generate checksums
        run: bun run ci:release:checksums SHA256SUMS.txt packages/coding-agent/binaries/omp-*
      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt
